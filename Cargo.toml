[package]
name = "rust-gltf2png"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "24.0.1"
image = "0.24"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
